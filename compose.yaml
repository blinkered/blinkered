# The development environment. Everything runs in a container; everything reloads on save.
#
#     docker compose up
#
# Then http://localhost:5173. The site and the API are on one origin there, as they are in
# production, so a session cookie behaves the same way in both.
#
# **Nothing here is deployable and none of it is trying to be.** The images that deploy are built
# by CI on a Linux runner, because a laptop builds arm64 and the cluster would pull it and die
# with `exec format error`. See docs/DEPLOY.md. This file exists so that the app can be run and
# worked on, and for no other reason.
#
# The one thing that is not automatic: after changing a dependency, `docker compose build`,
# because `node_modules` lives in the image rather than in the mount.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: blinkered
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: blinkered
    ports:
      # Published so the test suites and a psql on the machine can reach it. 55432, not 5432, so
      # it cannot collide with a Postgres already installed.
      - '55432:5432'
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      # The port opens well before the database will answer a query, so a TCP check would report
      # healthy while the first connection still fails.
      test: ['CMD-SHELL', 'pg_isready -U blinkered -d blinkered']
      interval: 2s
      timeout: 5s
      retries: 15

  # Watches src/schema.ts and pushes it into the database whenever it changes. Editing a column
  # is all it takes; there is no generate step in the loop.
  #
  # `push` is a development tool and this is a development file. What deploys is the generated
  # SQL in apps/server/drizzle, applied by the migrate entrypoint. See apps/server/README.md.
  schema:
    build: &dev
      context: .
      target: dev
    working_dir: /repo/apps/server
    command: ['pnpm', 'exec', 'tsx', 'watch', 'src/bin/dev-schema.ts']
    depends_on:
      postgres:
        condition: service_healthy
    environment: &database
      BLINKERED_DB_HOST: postgres
      BLINKERED_DB_PORT: '5432'
      BLINKERED_DB_TLS: 'false'
      BLINKERED_DB_USER: blinkered
      BLINKERED_DB_PASSWORD: testpass
      BLINKERED_DB_NAME: blinkered
      BLINKERED_DB_SCHEMA: blinkered
    volumes: &sources
      # Only the directories that get edited. The rest of the tree, and every `node_modules`,
      # comes from the image.
      - ./apps/server/src:/repo/apps/server/src
      - ./apps/server/drizzle.config.ts:/repo/apps/server/drizzle.config.ts
      # Mounted, not merely present, because this is the one thing the containers *write* that
      # has to survive them: a schema change generates the migration that ships, and a migration
      # written inside a container is a migration nobody ever commits.
      - ./apps/server/drizzle:/repo/apps/server/drizzle
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/index.html:/repo/apps/web/index.html
      - ./apps/web/how-to-play.html:/repo/apps/web/how-to-play.html
      - ./apps/web/vite.config.ts:/repo/apps/web/vite.config.ts
      - ./packages/engine/src:/repo/packages/engine/src
      - ./packages/i18n/src:/repo/packages/i18n/src
      - ./packages/words/src:/repo/packages/words/src

  api:
    build: *dev
    working_dir: /repo/apps/server
    # `tsx` runs the TypeScript directly and restarts on save, so there is no build in the loop.
    # What ships is still `tsc` output; this is only ever the developer's.
    command: ['pnpm', 'exec', 'tsx', 'watch', 'src/bin/serve.ts']
    depends_on:
      postgres:
        condition: service_healthy
      schema:
        condition: service_started
    environment:
      <<: *database
      PORT: '8080'
    # Not published. Everything reaches it through the web container, which is what puts the two
    # on one origin, exactly as Traefik does in production.
    expose:
      - '8080'
    volumes: *sources

  web:
    build: *dev
    working_dir: /repo
    # `--host` because the default binds loopback inside the container, which nothing outside it
    # can reach.
    command: ['pnpm', '--filter', '@blinkered/web', 'dev', '--host']
    depends_on:
      - api
    ports:
      - '5173:5173'
    environment:
      # Where the dev server sends `/v1`. One origin, so no CORS here and none in production.
      BLINKERED_API: http://api:8080
      # Bind mounts on macOS and Windows do not deliver filesystem events reliably, so the
      # watcher polls. Costs a little idle CPU and is the difference between hot reload working
      # and appearing to be broken.
      BLINKERED_POLL: '1'
    volumes: *sources

volumes:
  data:
