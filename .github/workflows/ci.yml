name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Two operating systems on purpose: the first CI run failed because a test read
    # /usr/share/dict/words, which exists on macOS and not on a Linux runner. Tests are
    # hermetic now, and this matrix is what keeps them that way.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm coverage
