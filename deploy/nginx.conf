# Production. Traefik terminates TLS, compresses, and routes `/v1` to the API before nginx is
# ever involved, so there is no proxy here and nginx serves files and nothing else.
#
# Everything this has in common with the local stack lives in nginx.shared.conf, so the two
# cannot drift. deploy/nginx.local.conf is the other one.
server {
    listen 8080;
    server_name _;

    include /etc/nginx/blinkered-shared.conf;
}
