# Local only, for `docker compose up` at the repo root.
#
# The one difference from production: nginx proxies `/v1` to the API container, because there is
# no Traefik here to do it. Everything else is nginx.shared.conf, which both configs include.
#
# The point of proxying rather than exposing the API on a second port is that the whole app is
# then on one origin, exactly as it is in production. The session is meant to be an ordinary
# same-origin cookie, and a local setup split across two ports would need CORS to work at all --
# which would mean developing against a different security model than the one that ships.
server {
    listen 8080;
    server_name _;

    location /v1/ {
        # By service name on the compose network. `resolver` is not needed because compose's DNS
        # is available at start-up and the name is fixed; a variable in proxy_pass is what forces
        # runtime resolution, and there is none here.
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /etc/nginx/blinkered-shared.conf;
}
