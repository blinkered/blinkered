# Blinkered.
#
# Three things that scale independently, because they are under different pressure: the web pod
# serves static files and is bounded by connections, the API replays nothing but does talk to a
# database, and Postgres is a StatefulSet that mostly should not be scaled at all.

nameOverride: ''
fullnameOverride: ''

image:
  repository: ghcr.io/blinkered/blinkered
  pullPolicy: IfNotPresent
  # Empty means the chart's appVersion. Set a `sha-<short>` tag per deploy rather than `latest`,
  # which moves under you: a pod restarting two weeks later comes up on different code than its
  # neighbours. See docs/DEPLOY.md.
  #
  # **One tag for the whole release.** The web image and the API image are two repositories and
  # one build: the same Dockerfile, the same CI run, the same commit. Letting either carry its
  # own tag would buy nothing a deploy wants and would make version skew expressible, so the
  # components below choose their own replicas, routes and resources and share this.
  tag: ''

# nginx serving the built files. No Node at runtime, nothing to configure, no state.
web:
  replicaCount: 2
  # The container listens high because it runs unprivileged and cannot bind a privileged port.
  containerPort: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

# The Hono API. Its own image, because it is Node and the web image is nginx.
api:
  enabled: true
  replicaCount: 2
  image:
    # Repository only. The tag is `image.tag`, shared with the web image; see above.
    repository: ghcr.io/blinkered/blinkered-api
  containerPort: 8080
  # Every route under here goes to the API; everything else goes to the web pod. Same origin, so
  # the session is an ordinary cookie and there is no CORS anywhere in the app.
  pathPrefix: /v1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # No CPU limit on purpose. Node throttled at a limit shows up as latency spikes rather than
      # as a clean failure, and requests are what the scheduler actually honours.
      memory: 512Mi
  # Non-secret configuration. Anything secret comes from the secret below.
  env:
    LOG_LEVEL: info

# Schema migrations, as a Job that Helm runs and waits for.
#
# Its own entrypoint rather than something the API does on the way up, because there is more than
# one replica: two pods starting together would race, and a migration that takes a while would
# hold the readiness probe off long enough to look like a failed rollout. The Job uses the API
# image and overrides the command, so there is no second image to keep in step.
migrations:
  enabled: true
  # The retries are the wait for Postgres. On a first install the StatefulSet is still coming up
  # when this hook fires, so the first attempts fail and the Job's own backoff paces them. An
  # init container polling pg_isready would do the same job and would replace migrate.ts's error
  # message, which names every wrong key at once, with a shell loop's silence.
  backoffLimit: 10
  # Ten minutes, covering Postgres starting cold and the migration running. A migration still
  # going after this is a migration to go and look at rather than to keep waiting on.
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

postgres:
  # false uses an external database instead. Nothing else in the chart changes: the API reads the
  # same seven keys out of a secret either way, so there is one code path rather than two.
  enabled: true
  image: postgres:17-alpine
  # A StatefulSet of one. More replicas need replication configured, which this chart does not
  # do, so this is here to be explicit rather than to be turned up.
  replicaCount: 1
  auth:
    username: blinkered
    # The database. Created by initdb when the chart owns Postgres, and in the provider's console
    # when it does not, because a database has to exist before anything can connect at all.
    db: blinkered
    # The schema inside that database. Created by the migrations, in both arrangements, so the
    # two behave identically rather than one of them arriving with a schema already made.
    schema: blinkered
    # Empty generates one on first install and preserves it across upgrades. Set it to adopt an
    # existing password.
    password: ''
  persistence:
    size: 10Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # Point at a secret you made yourself, and the chart creates none. Required when
  # `postgres.enabled` is false. It must carry exactly these keys:
  #
  #   host  port  tls-enabled  username  password  db  schema
  #
  existingSecret: ''

ingress:
  enabled: true
  className: public
  hosts:
    - playblinkered.com
  # Redirected to the first host above, so there is one origin. A guest's scores live in
  # localStorage, which is scoped per origin, so two hostnames means two leaderboards and the
  # second one looks empty rather than elsewhere.
  redirectHosts:
    - www.playblinkered.com
  # Traefik middleware references, resolved as `<namespace>-<name>@kubernetescrd`.
  middlewares:
    wwwRedirect: true
    compress: true

serviceAccount:
  create: false
  name: ''
