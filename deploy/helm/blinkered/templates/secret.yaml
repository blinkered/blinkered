{{- if not .Values.postgres.existingSecret }}
{{/*
The database connection, as seven keys.

The same shape whichever database is in play. When `postgres.enabled` is true these point at the
StatefulSet below; when it is false and no `existingSecret` was given, this still renders, so the
failure is a pod that cannot connect rather than a template that silently produced nothing.

`db` and `schema` are both here because Postgres distinguishes them and collapsing the two would
push the ambiguity into the API. They are also created by different things, which is the more
useful distinction: the **database** has to exist before anything can connect, so initdb makes it
here and a provider's console makes it there, while the **schema** is made by the migrations in
both arrangements. Having initdb create the schema too would have been easy and would have meant
the chart's Postgres arrived in a state the managed one does not, which is the divergence this
whole secret exists to avoid.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blinkered.databaseSecret" . }}
  labels:
    {{- include "blinkered.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  host: {{ include "blinkered.postgres.fullname" . | quote }}
  port: "5432"
  # In-cluster traffic between two pods on the same node network. Turn this on if the cluster
  # requires encryption between pods, and give Postgres a certificate to present.
  tls-enabled: "false"
  {{- else }}
  host: ''
  port: "5432"
  tls-enabled: "true"
  {{- end }}
  username: {{ .Values.postgres.auth.username | quote }}
  password: {{ include "blinkered.postgres.password" . | quote }}
  db: {{ .Values.postgres.auth.db | quote }}
  schema: {{ .Values.postgres.auth.schema | quote }}
{{- end }}
