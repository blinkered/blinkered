{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blinkered.fullname" . }}-api
  labels:
    {{- include "blinkered.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "blinkered.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blinkered.api.selectorLabels" . | nindent 8 }}
      annotations:
        # Rolls the API pods when the database secret changes, so a rotated password is picked up
        # by a deploy rather than by whenever a pod happens to restart next.
        checksum/database-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          # `image.tag`, not one of its own. Two repositories, one tag: both images come out
          # of the same Dockerfile in the same CI run, so a per-component tag could only ever
          # express a mistake — an API from one commit talking to a web bundle from another.
          image: "{{ .Values.api.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PORT
              value: {{ .Values.api.containerPort | quote }}
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.api.smtp.host }}
            - name: BLINKERED_SMTP_HOST
              value: {{ .Values.api.smtp.host | quote }}
            - name: BLINKERED_SMTP_PORT
              value: {{ .Values.api.smtp.port | quote }}
            - name: BLINKERED_SMTP_TLS
              value: {{ .Values.api.smtp.tls | quote }}
            - name: BLINKERED_MAIL_FROM
              value: {{ .Values.api.smtp.from | quote }}
            {{- end }}
            # The seven keys, from whichever secret is in play. Identical whether the database
            # is this chart's StatefulSet or a managed one somewhere else.
            {{- $secret := include "blinkered.databaseSecret" . }}
            - name: BLINKERED_DB_HOST
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: host } }
            - name: BLINKERED_DB_PORT
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: port } }
            - name: BLINKERED_DB_TLS
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: tls-enabled } }
            - name: BLINKERED_DB_USER
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: username } }
            - name: BLINKERED_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: password } }
            - name: BLINKERED_DB_NAME
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: db } }
            - name: BLINKERED_DB_SCHEMA
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: schema } }
          # Liveness says nothing about the database on purpose. A probe that fails when a
          # dependency is unreachable gets the pod restarted, which does not reach the dependency
          # either, so an outage downstream becomes a crash loop upstream.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blinkered.fullname" . }}-api
  labels:
    {{- include "blinkered.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "blinkered.api.selectorLabels" . | nindent 4 }}
{{- end }}
