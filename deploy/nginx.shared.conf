    root /usr/share/nginx/html;
    index index.html;

    # The .gz files the build made. `gzip off` because there is nothing left to compress on
    # the fly: anything without a pre-compressed twin is small or already compressed.
    gzip_static on;
    gzip off;

    # The word lists are UTF-8 and half of them are not Latin. `fetch` decodes as UTF-8
    # regardless, but anyone opening one directly deserves to read it.
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json
        application/manifest+json image/svg+xml;

    # `.webmanifest` is not in nginx's mime.types, so without this the home-screen manifest is
    # served as application/octet-stream. Browsers are forgiving about that and Safari is the
    # one that matters here, but a file served as the wrong type is a thing waiting to break.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # For the kubelet, and cheap enough to be worth having.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints these, so the URL changes when the content does.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The word lists do not carry a hash, so they get a short life and an ETag to revalidate
    # against. A stale one is caught by the app anyway: the header line has to parse.
    location /words/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # The two permalink shapes, and only those two, are answered with the app.
    #
    #   /g/<id>        one finished game
    #   /u/<username>  one player
    #
    # Scoped rather than blanket, because the rule below is right and stays right: a fallback
    # that catches everything is what made a missing word list arrive as index.html and parse as
    # HTML once already. These three prefixes hold nothing on disk, so nothing real can be masked
    # by them, and a bad id inside one is the app's 404 to draw rather than nginx's.
    #
    # `l` is a board, `/l/<language>/<difficulty>`, and it is two segments deep where the other
    # two are one. The pattern is a prefix match rather than a shape, so it covers both without
    # counting segments -- and `routeOf` in the app is the thing that decides what a board
    # address actually is. A board for a language nobody has a word list for reaches the app and
    # is told there is no such board, which is the app's answer to give.
    location ~ ^/(g|u|l)/ {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Moderation, which is one exact path rather than a prefix.
    #
    # `= /admin` and not `/admin`, so this cannot start swallowing a future `/admin-guide.html`
    # the way a prefix would. The app is served here because the panel is a screen somebody
    # works in for a while and a reload has to land back on it rather than on nginx's 404.
    #
    # Serving the bundle here grants nothing: every route under `/v1/admin` checks `is_admin`
    # on the session, so an unauthorised reader gets the panel's chrome and a refusal in every
    # pane of it. The alternative — hiding the path — would be hiding it from the person who
    # typed it and from nobody else.
    location = /admin {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Everything else: a wrong path is a 404 rather than the app pretending. That matters here,
    # for the reason above.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
