apiVersion: apps/v1
kind: Deployment
metadata:
  name: blinkered
  labels:
    app.kubernetes.io/name: blinkered
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blinkered
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blinkered
    spec:
      # The GHCR package is private, because the org does not permit public packages. Create
      # the secret once per namespace; see docs/DEPLOY.md. Delete these two lines if the
      # package is ever made public, and anonymous pulls will just work.
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Set by `deploy/release.sh`, or edit it here.
          image: ghcr.io/blinkered/blinkered:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Static files and one nginx worker. It needs very little, and asking for little is
          # what lets the scheduler put it anywhere.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # A read-only root filesystem means nginx needs somewhere to put its scratch files.
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
