apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blinkered
  namespace: blinkered-prod
  labels:
    app.kubernetes.io/name: blinkered
  annotations:
    # Attaches both middlewares, in order. The reference is `<namespace>-<name>@kubernetescrd`,
    # and the list applies to every router this Ingress creates, which is safe because the
    # redirect's regex only matches www. Redirect first, so a redirect is not compressed.
    # One line, no space after the comma: Traefik happens to trim it, and depending on that is
    # a poor trade when a middleware reference it cannot resolve takes the whole router out of
    # service rather than failing quietly.
    traefik.ingress.kubernetes.io/router.middlewares: 'blinkered-prod-www-to-apex@kubernetescrd,blinkered-prod-compress@kubernetescrd'
spec:
  # `public` and `private` are this cluster's two classes, both traefik.io/ingress-controller.
  # There is no class called `nginx` and no nginx controller, so nginx annotations do nothing.
  ingressClassName: public
  tls:
    # The certificate comes from Traefik's ACME resolver, keyed on the Host rules below, not
    # from cert-manager, which is not installed here. `secretName` is therefore vestigial; it is
    # kept because the live ingress has it and TLS works, and changing it buys nothing.
    - hosts:
        - playblinkered.com
        - www.playblinkered.com
      secretName: blinkered-tls
  # Both hostnames need a rule. This is the opposite of the nginx controller, where the www rule
  # must be left out because the annotation generates that server block itself: Traefik only
  # routes hosts it has a rule for, so without one, www never reaches the middleware and 404s.
  rules:
    - host: playblinkered.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blinkered
                port:
                  name: http
    - host: www.playblinkered.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blinkered
                port:
                  name: http
