<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="Blinkered">
  <title>Blinkered</title>
  <!--
    The game's own object, at the moment it is chosen.

    Nothing here is invented. The tile is a selected tile exactly as styles.css draws one: the
    selected background colour, the same colour for its border, and a white letter. The corner
    radius is the game's ratio, 10px on a 68px tile, so 151 on 1024. The letter is the game's
    weight. The title screen already spells BLINKERED in tiles that light up this way, so the
    icon and the game are visibly the same thing.

    The tile fills the frame and the ground is transparent, so every platform gets to apply its
    own corner and its own backdrop. The two places that cannot take a transparent or
    self-rounded icon get square, opaque variants; render.sh derives them from this file.

    Do not write a double hyphen anywhere in this comment. It is illegal inside an XML comment,
    and a renderer will reject the whole file rather than the comment.
  -->
  <rect width="1024" height="1024" rx="151" fill="#2f81f7"/>
  <text x="498" y="490" fill="#ffffff" text-anchor="middle" dominant-baseline="central"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="848" font-weight="650">B</text>
</svg>
