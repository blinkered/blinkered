<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="Blinkered">
  <title>Blinkered</title>
  <!--
    The game's own object, at the moment it is chosen.

    Nothing here is invented. The ground is the board's background (--bg), and the tile is a
    selected tile exactly as styles.css draws one: `background: var(--sel)`, the same colour for
    its border, and a white letter. The corner radius is the game's ratio, 10px on a 68px tile,
    and the letter is the game's weight. The title screen already spells BLINKERED in tiles that
    light up this way, so the icon and the game are visibly the same thing.

    Full bleed and fully opaque on purpose: the App Store requires an icon with no alpha and no
    rounded corners of its own, and applies its own mask. The margin here is wide enough that the
    mask never reaches the tile.
  -->
  <rect width="1024" height="1024" fill="#0e1116"/>
  <rect x="142" y="142" width="740" height="740" rx="109" fill="#2f81f7"/>
  <text x="502" y="496" fill="#ffffff" text-anchor="middle" dominant-baseline="central"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="613" font-weight="650">B</text>
</svg>
